services:
  - type: web
    name: datasetvc-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datasetvc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard after creating the service:
      # MINIO_ENDPOINT  — e.g. <account>.r2.cloudflarestorage.com
      # MINIO_ACCESS_KEY
      # MINIO_SECRET_KEY
      - key: MINIO_BUCKET
        value: datasets
      - key: MINIO_SECURE
        value: "true"

databases:
  - name: datasetvc-db
    plan: free
    databaseName: dvc
