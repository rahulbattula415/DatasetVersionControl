services:
  - type: web
    name: datasetvc-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      # Supabase session-pooler connection string. Set in the Render dashboard
      # (contains the DB password, so it is not committed here):
      #   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard after creating the service:
      # MINIO_ENDPOINT  — e.g. <account>.r2.cloudflarestorage.com
      # MINIO_ACCESS_KEY
      # MINIO_SECRET_KEY
      - key: MINIO_BUCKET
        value: datasets
      - key: MINIO_SECURE
        value: "true"
